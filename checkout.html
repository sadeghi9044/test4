<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>پرداخت پلن | سایت‌ساز</title>
<link href="vendor/vazirmatn/vazirmatn.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pro.css">
<style>
  .co-wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 80px; }
  .co-card { background: var(--card); border: 1px solid rgba(255,255,255,0.08); border-radius: 18px; padding: 24px; margin-bottom: 18px; }
  .co-card h2 { font-size: 1.1rem; margin-bottom: 14px; }
  .co-plan { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .co-price { font-size: 1.5rem; font-weight: 800; }
  .co-price small { font-size: .8rem; color: var(--muted); font-weight: 400; }
  .co-methods { display: grid; gap: 12px; }
  .co-method { text-align: right; width: 100%; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.12); color: var(--text); border-radius: 14px; padding: 16px; cursor: pointer; font-family: inherit; font-size: .95rem; }
  .co-method:hover:not(:disabled) { border-color: var(--primary); background: rgba(139,92,246,0.1); }
  .co-method:disabled { opacity: .45; cursor: not-allowed; }
  .co-method b { display: block; margin-bottom: 4px; }
  .co-method span { color: var(--muted); font-size: .82rem; }
  .co-cardnum { direction: ltr; text-align: center; font-size: 1.45rem; letter-spacing: 2px; font-weight: 700; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 14px; margin: 10px 0; user-select: all; }
  .co-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; font-size: .9rem; }
  .co-row span:first-child { color: var(--muted); }
  .co-field { margin: 14px 0; }
  .co-field label { display: block; font-size: .85rem; margin-bottom: 6px; color: var(--muted); }
  .co-field input[type=text], .co-field textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); color: var(--text); font-family: inherit; font-size: .92rem; }
  .co-field input[type=file] { width: 100%; font-family: inherit; color: var(--muted); }
  .co-preview { max-width: 100%; max-height: 260px; border-radius: 10px; margin-top: 10px; display: none; }
  .co-status { padding: 12px 16px; border-radius: 12px; margin-bottom: 14px; font-size: .9rem; line-height: 1.8; }
  .co-status.review { background: rgba(245,158,11,.12); border: 1px solid rgba(245,158,11,.3); color: #fbbf24; }
  .co-status.paid { background: rgba(16,185,129,.12); border: 1px solid rgba(16,185,129,.3); color: #6ee7b7; }
  .co-status.rejected { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: #fca5a5; }
  .co-msg { display: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="co-wrap">
  <a href="pricing.html" class="auth-back" style="display:inline-block;margin-bottom:18px;">← بازگشت به تعرفه‌ها</a>
  <h1 style="font-size:1.5rem;margin-bottom:20px;">پرداخت و فعال‌سازی پلن</h1>
  <div id="msg" class="auth-message"></div>

  <!-- مرحله ۱: انتخاب روش پرداخت -->
  <div id="stepPick" class="hidden">
    <div class="co-card">
      <div class="co-plan">
        <div><div style="color:var(--muted);font-size:.85rem;">پلن انتخاب‌شده</div><b id="planName" style="font-size:1.1rem;">—</b></div>
        <div class="co-price"><span id="planPrice">—</span> <small>تومان / <span class="days">۳۰</span> روز</small></div>
      </div>
    </div>
    <div class="co-card">
      <h2>روش پرداخت</h2>
      <div class="co-methods">
        <button class="co-method" id="mZarinpal" type="button"><b>💳 پرداخت آنلاین (زرین‌پال)</b><span>با کارت بانکی، فوری و خودکار فعال می‌شود</span></button>
        <button class="co-method" id="mCard" type="button"><b>🏦 کارت‌به‌کارت</b><span>مبلغ را واریز کن و تصویر رسید را بفرست؛ بعد از تأیید پشتیبانی فعال می‌شود</span></button>
      </div>
    </div>
  </div>

  <!-- مرحله ۲: کارت‌به‌کارت و رسید -->
  <div id="stepCard" class="hidden">
    <div id="statusBox"></div>
    <div class="co-card">
      <h2>۱) مبلغ را به این کارت واریز کن</h2>
      <div class="co-row"><span>پلن</span><b id="cPlan">—</b></div>
      <div class="co-row"><span>مبلغ</span><b><span id="cAmount">—</span> تومان</b></div>
      <div class="co-cardnum" id="cNumber">—</div>
      <div class="co-row"><span>به نام</span><b id="cHolder">—</b></div>
      <div class="co-row"><span>بانک</span><b id="cBank">—</b></div>
      <button class="btn btn-ghost full" id="copyBtn" type="button" style="margin-top:12px;">کپی شماره کارت</button>
    </div>
    <div class="co-card" id="receiptCard">
      <h2>۲) تصویر رسید را بفرست</h2>
      <div class="co-field"><label for="rcFile">تصویر رسید (PNG، JPG یا WEBP — حداکثر ۵ مگابایت)</label>
        <input type="file" id="rcFile" accept="image/png,image/jpeg,image/webp">
        <img id="rcPreview" class="co-preview" alt="پیش‌نمایش رسید"></div>
      <div class="co-field"><label for="rcRef">شماره پیگیری (اختیاری)</label><input type="text" id="rcRef" inputmode="numeric" maxlength="40" dir="ltr"></div>
      <div class="co-field"><label for="rcNote">توضیح (اختیاری)</label><textarea id="rcNote" rows="2" maxlength="300"></textarea></div>
      <button class="btn btn-primary full" id="sendBtn" type="button">ارسال رسید برای تأیید</button>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  const fa = (n) => Math.floor(n).toLocaleString('fa-IR');
  let paymentId = q.get('pay') || '';
  let info = null;

  function show(text, type) { const m = $('msg'); m.textContent = text; m.className = 'auth-message ' + (type || 'error'); m.style.display = 'block'; }

  function renderCard(p, card) {
    $('stepPick').classList.add('hidden'); $('stepCard').classList.remove('hidden');
    $('cPlan').textContent = p.planName; $('cAmount').textContent = fa(p.amount);
    $('cNumber').textContent = card ? card.number.replace(/(\d{4})(?=\d)/g, '$1 ') : '—';
    $('cHolder').textContent = (card && card.holder) || '—'; $('cBank').textContent = (card && card.bank) || '—';
    const sb = $('statusBox'); sb.innerHTML = '';
    const box = (cls, text) => { const d = document.createElement('div'); d.className = 'co-status ' + cls; d.textContent = text; sb.appendChild(d); };
    if (p.status === 'review') box('review', 'رسید شما ارسال شد و در انتظار تأیید است. بعد از تأیید، پلن به‌صورت خودکار فعال می‌شود. در صورت نیاز می‌توانی رسید جدیدی بفرستی.');
    if (p.status === 'paid') { box('paid', 'پرداخت تأیید شد و پلن شما فعال است. 🎉'); $('receiptCard').classList.add('hidden'); }
    if (p.status === 'rejected') box('rejected', 'رسید رد شد' + (p.adminNote ? ': ' + p.adminNote : '.') + ' لطفاً رسید صحیح را دوباره بفرست.');
    if (['canceled', 'failed'].includes(p.status)) { box('rejected', 'این پرداخت منقضی یا لغو شده است. از صفحه‌ی تعرفه‌ها دوباره شروع کن.'); $('receiptCard').classList.add('hidden'); }
  }

  async function loadPayment() {
    const r = await API.get('/api/billing/payments/' + encodeURIComponent(paymentId));
    renderCard(r.payment, r.card);
  }

  async function start(method) {
    try {
      const r = await API.post('/api/billing/checkout', { plan: q.get('plan'), method: method });
      if (method === 'zarinpal') { location.href = r.redirect; return; }
      paymentId = r.paymentId;
      history.replaceState(null, '', 'checkout.html?pay=' + encodeURIComponent(paymentId));
      await loadPayment();
    } catch (e) { show(e.message); }
  }

  $('mZarinpal').addEventListener('click', () => start('zarinpal'));
  $('mCard').addEventListener('click', () => start('card'));

  $('copyBtn').addEventListener('click', async () => {
    const n = $('cNumber').textContent.replace(/\s/g, '');
    try { await navigator.clipboard.writeText(n); show('شماره کارت کپی شد.', 'success'); } catch (e) { show('کپی نشد؛ شماره را دستی انتخاب کن.'); }
  });

  $('rcFile').addEventListener('change', (e) => {
    const f = e.target.files[0], img = $('rcPreview');
    if (!f) { img.style.display = 'none'; return; }
    img.src = URL.createObjectURL(f); img.style.display = 'block';
  });

  $('sendBtn').addEventListener('click', async () => {
    const f = $('rcFile').files[0];
    if (!f) return show('تصویر رسید را انتخاب کن.');
    if (f.size > 5 * 1024 * 1024) return show('حجم تصویر بیشتر از ۵ مگابایت است.');
    const btn = $('sendBtn'); btn.disabled = true;
    try {
      const url = '/api/billing/payments/' + encodeURIComponent(paymentId) + '/receipt?ref=' + encodeURIComponent($('rcRef').value) + '&note=' + encodeURIComponent($('rcNote').value);
      const r = await API.upload(url, f);
      show('رسید ارسال شد. منتظر تأیید باش.', 'success');
      await loadPayment();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) { show(e.message); } finally { btn.disabled = false; }
  });

  (async function init() {
    try {
      info = await API.get('/api/billing/info'); // اگر لاگین نباشد 401
    } catch (e) {
      if (e.status === 401) { location.href = 'login.html?next=' + encodeURIComponent('checkout.html' + location.search); return; }
      return show(e.message);
    }
    if (paymentId) { try { await loadPayment(); } catch (e) { show(e.message); } return; }
    const plan = info.plans.find((p) => p.key === q.get('plan'));
    if (!plan) return show('پلن نامعتبر است. از صفحه‌ی تعرفه‌ها انتخاب کن.');
    $('planName').textContent = plan.name; $('planPrice').textContent = fa(plan.price);
    document.querySelectorAll('.days').forEach((d) => { d.textContent = fa(info.days); });
    $('mZarinpal').disabled = !info.zarinpal; $('mCard').disabled = !info.card;
    if (!info.zarinpal) $('mZarinpal').querySelector('span').textContent = 'فعلاً در دسترس نیست';
    if (!info.card) $('mCard').querySelector('span').textContent = 'فعلاً در دسترس نیست';
    $('stepPick').classList.remove('hidden');
  })();
})();
</script>
</body>
</html>
