<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ورود ادمین | سایت‌ساز</title>
<meta name="robots" content="noindex, nofollow">
<link href="vendor/vazirmatn/vazirmatn.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ef4444'/%3E%3Cstop offset='1' stop-color='%23f59e0b'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='46' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pro.css">
</head>
<body>

<div class="admin-login-wrap">
  <div class="admin-login-card">
    <h1>🔐 ورود به پنل مدیریت</h1>
    <p>دسترسی محدود به مدیران سایت</p>

    <div class="admin-warning">
      ⚠️ این پنل فقط برای مدیران سیستم است. در صورت دسترسی غیرمجاز، پیگرد قانونی دارد.
    </div>

    <div id="loginMessage" class="auth-message"></div>

    <form id="adminLoginForm">
      <div class="auth-field">
        <label for="ad-user">نام کاربری</label>
        <input type="text" id="ad-user" placeholder="admin" autocomplete="username" required style="direction:ltr;text-align:left;">
      </div>

      <div class="auth-field">
        <label for="ad-pass">رمز عبور</label>
        <div class="password-wrap">
          <input type="password" id="ad-pass" placeholder="••••••••" autocomplete="current-password" required>
          <button type="button" class="password-toggle" data-toggle="ad-pass" aria-label="نمایش رمز">👁</button>
        </div>
      </div>

      <button type="submit" class="auth-btn" style="background: linear-gradient(135deg, #ef4444, #f59e0b); margin-top:16px;">ورود به پنل</button>
    </form>

    <div class="auth-footer" style="margin-top:16px;">
      <a href="index.html" style="color:var(--muted);">← بازگشت به سایت</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
(function () {
  const form = document.getElementById('adminLoginForm');
  const msg = document.getElementById('loginMessage');

  // اگر قبلاً وارد شده، مستقیم برو
  API.get('/api/admin/me').then(() => { location.replace('admin.html'); }).catch(() => {});

  document.querySelectorAll('.password-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.toggle);
      input.type = input.type === 'password' ? 'text' : 'password';
      btn.textContent = input.type === 'password' ? '👁' : '🙈';
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    const user = document.getElementById('ad-user').value.trim();
    const pass = document.getElementById('ad-pass').value;
    const btn = form.querySelector('button[type="submit"]');
    btn.disabled = true;
    API.post('/api/admin/login', { username: user, password: pass }).then(() => {
      msg.className = 'auth-message success';
      msg.textContent = '✓ ورود موفق. در حال انتقال به پنل...';
      setTimeout(() => window.location.href = 'admin.html', 500);
    }).catch(err => {
      btn.disabled = false;
      msg.className = 'auth-message error';
      msg.textContent = '✗ ' + err.message;
    });
  });
})();
</script>
</body>
</html>
